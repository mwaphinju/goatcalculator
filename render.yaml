# Render Blueprint for GOAT Calculator's static site. No secrets or the
# production NEXT_PUBLIC_SITE_URL value are set here (see
# docs/SEO_LAUNCH_CHECKLIST.md): set NEXT_PUBLIC_SITE_URL in the Render
# dashboard's Environment tab, to this service's actual live URL, once it
# is known, then trigger a redeploy.
services:
  - type: web
    name: goatcalculator
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
